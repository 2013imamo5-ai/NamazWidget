plugins { id 'com.android.application' }

def signingPassword = System.getenv('NAMAZ_SIGNING_PASSPHRASE') ?: ''

android {
    namespace 'com.namazwidget.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.namazwidget.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }
    signingConfigs {
        if (signingPassword) {
            release {
                storeFile file('../signing/namaz-release.p12')
                storePassword signingPassword
                keyAlias 'namaz'
                keyPassword signingPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingPassword) signingConfig signingConfigs.release
        }
    }
}
